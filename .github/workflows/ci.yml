name: CI

on:
  push:
    branches: [main, mvp1]
  pull_request:
    branches: [main, mvp1]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    if: hashFiles('backend/requirements.txt') != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check . || true
      - name: Tests
        run: pytest -q || true

  frontend-checks:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint --if-present || true
      - name: Build
        run: npm run build

  ml-checks:
    runs-on: ubuntu-latest
    if: hashFiles('ml/requirements.txt') != ''
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke import
        run: python -c "import pandas, sklearn, xgboost; print('ml ok')"