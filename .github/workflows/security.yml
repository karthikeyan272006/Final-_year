name: Security

on:
  push:
    branches: [main, mvp1]
  pull_request:
    branches: [main, mvp1]
  schedule:
    - cron: "0 0 * * 1"

jobs:
  python-audit:
    runs-on: ubuntu-latest
    if: hashFiles('backend/requirements.txt') != '' || hashFiles('ml/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          if [ -f backend/requirements.txt ]; then pip-audit -r backend/requirements.txt || true; fi
          if [ -f ml/requirements.txt ]; then pip-audit -r ml/requirements.txt || true; fi

  node-audit:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        run: npm ci && npm audit --audit-level=high || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3